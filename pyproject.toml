[build-system]
requires = ["setuptools==75.6.0"]
build-backend = "setuptools.build_meta"

[project]
name = "rsna-knee"
version = "0.1.0"
description = "Auditable study-level RSNA knee MRI training"
requires-python = ">=3.11"
dependencies = [
  "numpy==2.2.1",
  "pandas==2.2.3",
  "pyarrow==25.0.1",
  "torch==2.14.0",
  "pydicom==3.0.2",
  "pylibjpeg==2.1.0",
  "pylibjpeg-libjpeg==2.4.0",
  "pylibjpeg-openjpeg==2.5.0",
  "requests==2.32.3",
  "urllib3==2.8.0",
  "fsspec==2026.6.0",
  "scikit-learn==1.6.0",
  "Pillow==11.0.0",
]

[project.optional-dependencies]
dev = ["pytest==8.3.4", "ruff==0.9.10", "mypy==1.15.0", "pandas-stubs==2.2.3.250308", "types-requests==2.32.0.20250306"]
competitive = ["transformers==5.6.1", "safetensors==0.7.0"]
compact = ["timm==1.0.30", "torchvision==0.29.1", "safetensors==0.7.0"]

[tool.setuptools.packages.find]
include = ["rsna*"]

[tool.ruff]
target-version = "py310"
line-length = 100
extend-exclude = ["initiative/legacy", "initiative/provenance/report_review_workflow.original.py", "initiative/provenance/patient_header_scan.original.py", "initiative/audits/duplicate-consistency-adjudication-v1/evidence"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.ruff.lint.per-file-ignores]
"workflows/report_review.py" = ["F821"]

[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true
check_untyped_defs = true

[tool.pytest.ini_options]
testpaths = ["tests"]
